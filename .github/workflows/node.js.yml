# Installs dependencies, lints, builds and tests the site on every push and PR.
# See: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build and Statically Render
      run: npm run build
    - name: Verify prerendered routes
      run: npm run check:prerender
    - name: Test
      run: npm test
